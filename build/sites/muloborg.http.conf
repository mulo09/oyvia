# Served while muloborg.com still has no Let's Encrypt certificate.
server {
    listen 80;
    server_name muloborg.com www.muloborg.com;
    root /usr/share/nginx/muloborg;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
