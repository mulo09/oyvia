server {
    listen 443 ssl default_server;
    server_name olasyvientos.es www.olasyvientos.es;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/olasyvientos.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olasyvientos.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/sites/security-headers.conf;

    # API reverse proxy to backend on port 8070
    location /api/ {
        proxy_pass http://51.92.169.204:8070/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt and sitemap.xml are generated by the backend so the sitemap
    # always reflects the articles that are actually published.
    location = /robots.txt {
        proxy_pass http://51.92.169.204:8070/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://51.92.169.204:8070/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Article pages. Crawlers and social scrapers are handed the server rendered
    # page (real title, description, Open Graph tags and JSON-LD); browsers get
    # the Angular shell as before. `return 418` + error_page is the standard way
    # to branch on a variable without calling proxy_pass inside an `if`.
    location ~ ^/article/(?<article_id>\d+)$ {
        error_page 418 = @crawler;
        if ($is_crawler) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @crawler {
        proxy_pass http://51.92.169.204:8070/seo/article/$article_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app shell must never be cached: it references hashed asset filenames
    # that change on every deploy.
    location = /index.html {
        include /etc/nginx/sites/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Cache static assets. `webm` was missing, so the stage clips fell through
    # to the default `location /` block and got no cache headers at all.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|webp|avif)$ {
        include /etc/nginx/sites/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Accept-Ranges bytes always;
    }

    # Angular routing support - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
