server {
    listen 443 ssl;
    http2 on;
    server_name muloborg.com www.muloborg.com;
    root /usr/share/nginx/muloborg;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/muloborg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muloborg.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Angular routing support - redirect all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/muloborg;
    }
}
