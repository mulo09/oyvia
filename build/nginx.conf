events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json
               application/xml image/svg+xml;

    # Crawlers and social media scrapers do not execute JavaScript, so requests
    # for /article/:id coming from them are served the pre-rendered page built
    # by the Go backend instead of the empty Angular shell.
    map $http_user_agent $is_crawler {
        default                     0;
        "~*googlebot"               1;
        "~*bingbot"                 1;
        "~*duckduckbot"             1;
        "~*yandex(bot|images)"      1;
        "~*baiduspider"             1;
        "~*applebot"                1;
        "~*facebookexternalhit"     1;
        "~*facebookcatalog"         1;
        "~*twitterbot"              1;
        "~*linkedinbot"             1;
        "~*whatsapp"                1;
        "~*slackbot"                1;
        "~*discordbot"              1;
        "~*telegrambot"             1;
        "~*pinterest"               1;
        "~*embedly"                 1;
        "~*redditbot"               1;
    }

    # One virtual host per domain. entrypoint.sh writes the right variant of
    # each site into conf.d depending on whether its certificate exists yet.
    include /etc/nginx/conf.d/*.conf;
}
