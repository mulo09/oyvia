<nav class="nav" aria-label="Navegación principal">

    <li class="nav-item">
      <a routerLink="/about" routerLinkActive="nav-link--active" ariaCurrentWhenActive="page"

      <a routerLink="/surf-calendar" routerLinkActive="nav-link--active" ariaCurrentWhenActive="page"

    </li>
    <li class="nav-item">
      <a routerLink="/contact" routerLinkActive="nav-link--active" ariaCurrentWhenActive="page"
