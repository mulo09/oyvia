<button type="button"
        class="like__btn"
        [class.like__btn--active]="liked"
        [class.like__btn--compact]="compact"
        [attr.aria-pressed]="liked"
        [attr.aria-label]="ariaLabel"
        (click)="toggle($event)">
  <!-- Thumbs up. The shape is drawn with strokes and only filled once the
       visitor liked the article, same behaviour the heart had. -->
  <svg class="like__icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"
       [attr.fill]="liked ? 'currentColor' : 'none'"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"/>
    <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
  </svg>
  <span class="like__label" *ngIf="!compact">{{ label }}</span>
  <span class="like__count">{{ count }}</span>
</button>
